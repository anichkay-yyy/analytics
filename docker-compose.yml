services:
  anich-analytics-db:
    image: postgres:15-alpine
    container_name: anich-analytics-db
    restart: always
    environment:
      POSTGRES_USER: anich_analytics
      POSTGRES_PASSWORD: anich_analytics123
      POSTGRES_DB: anich_analytics
    volumes:
      - anich_analytics_db_data:/var/lib/postgresql/data

  anich-analytics:
    build: ./server
    container_name: anich-analytics
    restart: always
    environment:
      DATABASE_URL: postgresql://anich_analytics:anich_analytics123@anich-analytics-db:5432/anich_analytics
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
    volumes:
      - anich_analytics_data:/app/data
    depends_on:
      - anich-analytics-db

  anich-analytics-admin:
    build:
      context: ./admin
      args:
        VITE_VAPID_PUBLIC_KEY: ${VITE_VAPID_PUBLIC_KEY}
    container_name: anich-analytics-admin
    restart: always
    ports:
      - "33003:80"
    depends_on:
      - anich-analytics

volumes:
  anich_analytics_db_data:
  anich_analytics_data:
